<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NusaMaps by VdnX.Dev</title>
    
    <!-- Leaflet & Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <!-- Google Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <!-- WAJIB PAKAI TITIK ./ -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- Splash Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="spinner"></div>
        <p>Memuat Peta...</p>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- UI Overlay -->
    <div class="search-container">
        <span class="material-symbols-outlined search-icon">search</span>
        <input type="text" id="search-input" placeholder="Cari lokasi, kota, atau tempat...">
        <div id="search-results" class="search-results hidden"></div>
    </div>

    <div class="floating-controls">
        <button id="btn-locate" class="fab"><span class="material-symbols-outlined">my_location</span></button>
        <button id="btn-route" class="fab"><span class="material-symbols-outlined">directions</span></button>
    </div>

    <!-- Scripts CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    
    <!-- WAJIB PAKAI TITIK ./ -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
